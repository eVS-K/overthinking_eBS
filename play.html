<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d1a">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://overthinking-ebs.onrender.com; frame-src 'none'; upgrade-insecure-requests">
  <title>OVERTHINKING — 起動中</title>
  <link rel="stylesheet" href="play-gateway.css?v=gateway-v1">
  <script src="play-gateway.js?v=gateway-v1" defer></script>
</head>
<body>
  <main class="play-gateway" aria-live="polite" aria-atomic="true">
    <section class="play-gateway-panel" aria-labelledby="play-gateway-title">
      <span class="play-gateway-kicker">OVERTHINKING</span>
      <h1 id="play-gateway-title">対戦サーバーを起動しています</h1>
      <p>しばらく利用がなかった場合、準備に最大約1分かかることがあります。</p>
      <div class="play-gateway-progress" aria-hidden="true"><i></i></div>
      <strong id="play-gateway-status">接続を確認しています…</strong>
      <small>この画面のままお待ちください。準備ができ次第、自動でゲーム画面へ移動します。</small>
    </section>
  </main>
</body>
</html>
